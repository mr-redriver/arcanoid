<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        touch-action: none; /* предотвращает случайные свайпы */
        user-select: none;
      }

      #gameContainer {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at 30% 20%, #0a1924, #000814);
      }

      #game {
        border-radius: 12px;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        background: linear-gradient(#061620, #0d1e28);
        width: 100%;
        height: 100%;
      }

      #overlay {
        position: absolute;
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
        font-family: Arial, sans-serif;
        color: #fff;
        font-size: clamp(14px, 3vw, 20px); /* адаптивный размер текста */
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        display: flex;
        gap: 1.2rem;
      }

      #miniVideo {
        position: absolute;
        right: 0.8rem;
        top: 0.8rem;
        width: 140px;
        height: 100px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
        transform: scaleX(-1);
        object-fit: cover;
      }

      @media (max-width: 768px) {
        #miniVideo {
          width: 100px;
          height: 75px;
          right: 0.5rem;
          top: 0.5rem;
        }

        #overlay {
          flex-direction: column;
          align-items: center;
          gap: 0.5rem;
          font-size: clamp(12px, 4vw, 18px);
        }
      }
    </style>
  </head>
  <body>
    <div id="gameContainer">
      <canvas id="game"></canvas>
      <video id="miniVideo" autoplay muted playsinline></video>
      <div id="overlay">
        <span id="score">Очки: 0</span>
        <span id="lives" style="margin-left: 20px">Жизни: 3</span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <!--  Главный модуль распознавания рук. -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <!--  Вспомогательный модуль для работы с веб-камерой. -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <!-- Модуль для визуализации руки на canvas, используется для получения координат -->

    <script>
      const video = document.getElementById("miniVideo");
      const gameCanvas = document.getElementById("game");
      const ctx = gameCanvas.getContext("2d");

      let W = 0,
        H = 0;
      let score = 0,
        lives = 3,
        paused = false,
        gameOver = false;
      let paddle,
        ball,
        rows = 6,
        cols = 10,
        pad = 8,
        offTop = 100,
        offLeft = 60,
        bw,
        bh,
        bricks = [];
      let pointX = 0,
        fingersUp = 0,
        gestureCooldown = 0;
      const smoothFactor = 0.25;

      function resizeCanvas() {
        W = window.innerWidth;
        H = window.innerHeight;
        gameCanvas.width = W;
        gameCanvas.height = H;

        // Пересчитываем размеры элементов, если игра уже запущена
        if (paddle && ball) {
          paddle.w = W * 0.15;
          paddle.h = 14;
          paddle.y = H - 60;
          paddle.x = Math.min(paddle.x, W - paddle.w);
          ball.x = Math.min(ball.x, W - ball.r);
          ball.y = Math.min(ball.y, H - ball.r);
        }
      }
      window.addEventListener("resize", resizeCanvas);

      function initGame() {
        resizeCanvas();
        paddle = { w: W * 0.15, h: 14, x: W / 2 - (W * 0.15) / 2, y: H - 60 };
        ball = { r: 10, x: W / 2, y: H / 2, vx: 6, vy: -6 };
        bw = (W - 2 * offLeft - (cols - 1) * pad) / cols;
        bh = 20;
        bricks = [];
        for (let r = 0; r < rows; r++) {
          const row = [];
          for (let c = 0; c < cols; c++) row.push({ alive: true });
          bricks.push(row);
        }
        score = 0;
        lives = 3;
        gameOver = false;
        paused = false;
        pointX = W / 2;
        updateUI();
      }

      function resetGame() {
        initGame();
      }

      function updateUI() {
        document.getElementById("score").textContent = "Очки: " + score;
        document.getElementById("lives").textContent = "Жизни: " + lives;
      }

      function drawOverlay() {
        if (!gameOver) return;
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 48px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Игра окончена", W / 2, H / 2 - 40);
        ctx.font = "24px Arial";
        ctx.fillText(
          "Сожмите кулак (✊), чтобы перезапустить",
          W / 2,
          H / 2 + 10
        );
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const b = bricks[r][c];
            if (!b.alive) continue;
            const bx = offLeft + c * (bw + pad),
              by = offTop + r * (bh + pad);
            ctx.fillStyle = `hsl(${200 - r * 20},70%,${45 + r * 5}%)`;
            ctx.fillRect(bx, by, bw, bh);
          }
        }
        ctx.fillStyle = "#f4f4f4";
        ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, 2 * Math.PI);
        ctx.fillStyle = "#ffd27f";
        ctx.fill();
        drawOverlay();
      }

      function updatePhysics(dt) {
        if (paused || gameOver) return;
        const step = Math.min(dt, 30);
        let nextX = ball.x + (ball.vx * step) / 16;
        let nextY = ball.y + (ball.vy * step) / 16;

        // Столкновения со стенами
        if (nextX - ball.r < 0) {
          nextX = ball.r;
          ball.vx = Math.abs(ball.vx);
        } else if (nextX + ball.r > W) {
          nextX = W - ball.r;
          ball.vx = -Math.abs(ball.vx);
        }
        if (nextY - ball.r < 0) {
          nextY = ball.r;
          ball.vy = Math.abs(ball.vy);
        }

        // Платформа
        if (
          nextY + ball.r >= paddle.y &&
          nextY - ball.r <= paddle.y + paddle.h &&
          nextX >= paddle.x &&
          nextX <= paddle.x + paddle.w &&
          ball.vy > 0
        ) {
          const rel = (nextX - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          const speed = Math.hypot(ball.vx, ball.vy);
          const angle = rel * (Math.PI / 3);
          ball.vx = speed * Math.sin(angle);
          ball.vy = -Math.abs(speed * Math.cos(angle));
          nextY = paddle.y - ball.r - 1;
        }

        // Потеря жизни
        if (nextY - ball.r > H) {
          lives--;
          updateUI();
          if (lives <= 0) {
            gameOver = true;
            return;
          } else {
            nextX = W / 2;
            nextY = H / 2;
            ball.vx = 6;
            ball.vy = -6;
            paused = true;
            setTimeout(() => (paused = false), 700);
          }
        }

        // Кирпичи
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const b = bricks[r][c];
            if (!b.alive) continue;
            const bx = offLeft + c * (bw + pad),
              by = offTop + r * (bh + pad);
            if (
              nextX + ball.r > bx &&
              nextX - ball.r < bx + bw &&
              nextY + ball.r > by &&
              nextY - ball.r < by + bh
            ) {
              b.alive = false;
              score += 10;
              updateUI();

              // 🔥 Новое: ускоряем мяч в зависимости от счёта
              const speedMul = 1 + Math.min(score / 500, 1.5); // максимум ×2.5
              const dir = Math.atan2(ball.vy, ball.vx);
              const baseSpeed = 6 * speedMul;
              ball.vx = baseSpeed * Math.cos(dir);
              ball.vy = baseSpeed * Math.sin(dir);

              ball.vy = -ball.vy;
              nextY += ball.vy > 0 ? 4 : -4;
              break;
            }
          }
        }

        ball.x = nextX;
        ball.y = nextY;
      }

      let last = performance.now();
      function loop(t) {
        const dt = t - last;
        last = t;
        updatePhysics(dt);
        draw();
        requestAnimationFrame(loop);
      }

      // --- MediaPipe setup ---
      const hands = new Hands({
        locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`,
      });
      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7,
      });

      hands.onResults((res) => {
        if (!res.multiHandLandmarks || res.multiHandLandmarks.length === 0)
          return;
        const lm = res.multiHandLandmarks[0];

        // --- Подсчёт пальцев ---
        const tips = [8, 12, 16, 20];
        let count = 0;
        for (let i = 0; i < tips.length; i++)
          if (lm[tips[i]].y < lm[tips[i] - 2].y) count++;
        if (lm[4].x > lm[3].x) count++;
        fingersUp = count;

        // --- Движение платформы ---
        const idx = lm[8];
        const targetX = (1 - idx.x) * W;
        pointX = pointX * (1 - smoothFactor) + targetX * smoothFactor;
        const rel = pointX / W;
        paddle.x = rel * (W - paddle.w);

        // --- Распознавание тыльной стороны ---
        function isBackOfHand(lm) {
          const wrist = lm[0];
          const indexBase = lm[5];
          const pinkyBase = lm[17];

          // Вектор ладони
          const v1 = {
            x: indexBase.x - wrist.x,
            y: indexBase.y - wrist.y,
            z: indexBase.z - wrist.z,
          };
          const v2 = {
            x: pinkyBase.x - wrist.x,
            y: pinkyBase.y - wrist.y,
            z: pinkyBase.z - wrist.z,
          };

          // Вектор нормали (перпендикуляр к плоскости ладони)
          const normal = {
            x: v1.y * v2.z - v1.z * v2.y,
            y: v1.z * v2.x - v1.x * v2.z,
            z: v1.x * v2.y - v1.y * v2.x,
          };

          // Если нормаль указывает "от камеры" → тыльная сторона
          return normal.z > 0;
        }

        // --- Управление ---
        if (gestureCooldown > 0) gestureCooldown--;

        if (gestureCooldown === 0) {
          // Пауза: раскрытая ладонь
          if (fingersUp === 5 && !gameOver) {
            paused = !paused;
            gestureCooldown = 30;
          }
          // Перезапуск: кулак + тыльная сторона
          else if (fingersUp === 0 && isBackOfHand(lm)) {
            resetGame();
            gestureCooldown = 30;
          }
        }
      });

      // --- запуск камеры и игры ---
      async function startCameraAndGame() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: false,
          });
          video.srcObject = stream;

          const camera = new Camera(video, {
            onFrame: async () => {
              await hands.send({ image: video });
            },
            width: 160,
            height: 120,
          });
          camera.start();

          const waitForVideo = setInterval(() => {
            if (video.readyState >= 2) {
              clearInterval(waitForVideo);
              initGame();
              loop(performance.now());
            }
          }, 200);
        } catch (err) {
          alert("Не удалось получить доступ к камере: " + err.message);
          console.error(err);
        }
      }

      // 🔹 Добавляем кнопку для запроса доступа (обязательно для мобильных)
      const startBtn = document.createElement("button");
      startBtn.textContent = "Запустить камеру и игру";
      startBtn.style.cssText = `
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			padding: 14px 24px;
			font-size: 18px;
			background: #0066ff;
			color: white;
			border: none;
			border-radius: 8px;
			box-shadow: 0 0 20px rgba(0,0,0,0.4);
		`;
      document.body.appendChild(startBtn);

      startBtn.addEventListener("click", async () => {
        startBtn.remove();
        await startCameraAndGame();
      });
    </script>
  </body>
</html>
