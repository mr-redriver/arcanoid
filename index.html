<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Арканоид с управлением жестами</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;
      }
      canvas#game {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      video#miniVideo {
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 120px;
        height: 90px;
        border: 2px solid #fff;
        border-radius: 8px;
        z-index: 10;
      }
      #startButton {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #28a745;
        color: white;
        font-size: 1.5em;
        border: none;
        border-radius: 12px;
        padding: 15px 25px;
        z-index: 20;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <button id="startButton">▶️ Начать игру</button>
    <video id="miniVideo" autoplay playsinline muted></video>
    <canvas id="game"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script>
      let W, H;
      const gameCanvas = document.getElementById("game");
      const ctx = gameCanvas.getContext("2d");
      const video = document.getElementById("miniVideo");
      const startButton = document.getElementById("startButton");

      function resizeCanvas() {
        W = window.innerWidth;
        H = window.innerHeight;
        gameCanvas.width = W;
        gameCanvas.height = H;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      // --- Игровое состояние ---
      let score = 0,
        lives = 3,
        paused = false,
        gameOver = false;
      let paddle = { w: W * 0.18, h: 14, x: W / 2, y: H - 70 };
      let ball = { r: 10, x: W / 2, y: H / 2, vx: 6, vy: -6 };
      let rows = 6,
        cols = 10,
        pad = 8,
        offTop = 100,
        offLeft = 60;
      let bw,
        bh,
        bricks = [];
      let pointX = W / 2,
        fingersUp = 0,
        gestureCooldown = 0;
      const smoothFactor = 0.25;
      let speedMultiplier = 1;

      function initBricks() {
        bw = (W - 2 * offLeft - (cols - 1) * pad) / cols;
        bh = 20;
        bricks = [];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            bricks.push({
              x: offLeft + c * (bw + pad),
              y: offTop + r * (bh + pad),
              active: true,
            });
          }
        }
      }
      function resetGame() {
        score = 0;
        lives = 3;
        gameOver = false;
        ball = { r: 10, x: W / 2, y: H / 2, vx: 6, vy: -6 };
        initBricks();
      }
      function updateUI() {
        ctx.font = "20px sans-serif";
        ctx.fillStyle = "white";
        ctx.fillText(`Очки: ${score}`, 20, 30);
        ctx.fillText(`Жизни: ${lives}`, W - 130, 30);
      }
      function draw() {
        ctx.clearRect(0, 0, W, H);
        // Мяч
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, 2 * Math.PI);
        ctx.fillStyle = "#ff0";
        ctx.fill();
        // Платформа
        ctx.fillStyle = "#0ff";
        ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
        // Кирпичи
        ctx.fillStyle = "#f44";
        for (let b of bricks) {
          if (b.active) ctx.fillRect(b.x, b.y, bw, bh);
        }
        updateUI();
      }
      function updatePhysics(dt) {
        if (paused || gameOver) return;
        let nextX = ball.x + ball.vx * speedMultiplier;
        let nextY = ball.y + ball.vy * speedMultiplier;

        // Отскоки
        if (nextX - ball.r < 0) {
          nextX = ball.r;
          ball.vx = Math.abs(ball.vx);
        }
        if (nextX + ball.r > W) {
          nextX = W - ball.r;
          ball.vx = -Math.abs(ball.vx);
        }
        if (nextY - ball.r < 0) {
          nextY = ball.r;
          ball.vy = Math.abs(ball.vy);
        }

        // Платформа
        if (
          nextY + ball.r >= paddle.y &&
          nextY - ball.r <= paddle.y + paddle.h &&
          nextX >= paddle.x &&
          nextX <= paddle.x + paddle.w &&
          ball.vy > 0
        ) {
          const rel = (nextX - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          const speed = Math.hypot(ball.vx, ball.vy);
          const angle = rel * (Math.PI / 3);
          ball.vx = speed * Math.sin(angle);
          ball.vy = -Math.abs(speed * Math.cos(angle));
          nextY = paddle.y - ball.r - 1;
        }

        // Падение
        if (nextY - ball.r > H) {
          lives--;
          if (lives <= 0) {
            gameOver = true;
            paused = true;
            return;
          }
          nextX = W / 2;
          nextY = H / 2;
          ball.vx = 6;
          ball.vy = -6;
          paused = true;
          setTimeout(() => (paused = false), 700);
        }

        // Кирпичи
        for (let b of bricks) {
          if (
            b.active &&
            nextX > b.x &&
            nextX < b.x + bw &&
            nextY > b.y &&
            nextY < b.y + bh
          ) {
            b.active = false;
            score++;
            speedMultiplier = 1 + score / 50; // ускорение!
            ball.vy *= -1;
            break;
          }
        }
        ball.x = nextX;
        ball.y = nextY;
      }
      let last = performance.now();
      function loop(t) {
        const dt = t - last;
        last = t;
        updatePhysics(dt);
        draw();
        requestAnimationFrame(loop);
      }
      initBricks();
      loop(performance.now());

      // --- MediaPipe ---
      const hands = new Hands({
        locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`,
      });
      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7,
      });
      hands.onResults((res) => {
        if (!res.multiHandLandmarks || res.multiHandLandmarks.length === 0)
          return;
        const lm = res.multiHandLandmarks[0];
        const tips = [8, 12, 16, 20];
        let count = 0;
        for (let i = 0; i < tips.length; i++)
          if (lm[tips[i]].y < lm[tips[i] - 2].y) count++;
        if (lm[4].x > lm[3].x) count++;
        fingersUp = count;

        const idx = lm[8];
        const targetX = (1 - idx.x) * W;
        pointX = pointX * (1 - smoothFactor) + targetX * smoothFactor;
        const rel = pointX / W;
        paddle.x = rel * (W - paddle.w);

        if (gestureCooldown > 0) gestureCooldown--;
        if (gestureCooldown === 0) {
          const palmZ = lm[0].z;
          const wristZ = lm[9].z;
          const backGesture = palmZ > wristZ + 0.05; // тыльная сторона руки
          if (fingersUp === 5 && !gameOver) {
            paused = !paused;
            gestureCooldown = 30;
          } else if (backGesture && gameOver) {
            resetGame();
            paused = false;
            gestureCooldown = 30;
          }
        }
      });

      // --- Запуск камеры (только по клику) ---
      startButton.addEventListener("click", async () => {
        startButton.style.display = "none";
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
          });
          video.srcObject = stream;
          const camera = new Camera(video, {
            onFrame: async () => {
              await hands.send({ image: video });
            },
            width: 160,
            height: 120,
          });
          camera.start();
        } catch (err) {
          alert(
            "Не удалось получить доступ к камере. Разрешите использование камеры."
          );
          console.error(err);
        }
      });
    </script>
  </body>
</html>
